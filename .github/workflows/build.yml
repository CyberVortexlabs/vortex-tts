name: Build Vortex TTS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (signed)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace || true

      - name: Rename APKs
        run: |
          DBG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Debug: $DBG_APK"
          echo "Release: $REL_APK"
          ls -lh app/build/outputs/apk/debug/ || true
          ls -lh app/build/outputs/apk/release/ || true
          [ -n "$DBG_APK" ] && cp "$DBG_APK" VortexTTS-debug.apk || echo "no debug apk"
          [ -n "$REL_APK" ] && cp "$REL_APK" VortexTTS.apk || cp VortexTTS-debug.apk VortexTTS.apk
          ls -lh VortexTTS*.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VortexTTS-all
          path: |
            VortexTTS.apk
            VortexTTS-debug.apk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: Vortex TTS v1.0.9
          files: |
            VortexTTS.apk
            VortexTTS-debug.apk
