name: Build Vortex TTS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Debug APK (signed)
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          REL_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DBG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found release APK: $REL_APK"
          echo "Found debug APK: $DBG_APK"
          ls -lh app/build/outputs/apk/release/ || true
          ls -lh app/build/outputs/apk/debug/ || true
          cp "$REL_APK" VortexTTS.apk
          cp "$DBG_APK" VortexTTS-debug.apk
          ls -lh VortexTTS*.apk
          # verify debug APK is signed (should have META-INF)
          unzip -l VortexTTS-debug.apk | grep -i META-INF || echo "no META-INF"
          # verify with apksigner if available
          if command -v apksigner >/dev/null 2>&1; then apksigner verify --print-certs VortexTTS-debug.apk || true; fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VortexTTS-all
          path: |
            VortexTTS.apk
            VortexTTS-debug.apk
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Vortex TTS v1.0.2
          files: |
            VortexTTS.apk
            VortexTTS-debug.apk
          generate_release_notes: true
